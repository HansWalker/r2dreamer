defaults:
  - jepa_dmc
  - _self_

model_family: temporal_straightening
logdir: logdir/temporal_straightening_dmc_vision/${scenario.name}/seed_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}

jepa_model:
  # Preserve the visual coefficient of the former mean over 208 visual + 10 proprio channels.
  prediction_weight: 0.9541284403669725
  encoder:
    embedding_dim: 208
    vision:
      base_channels: 13
  predictor:
    heads: 6
    mlp_dim: 816
  decoder:
    # Detached visualization only; excluded from the learning/control budget.
    enabled: false
    vision:
      base_channels: 34
  optim:
    weight_decay: 1e-2
    grad_clip: .inf
  planner:
    type: gradient
    samples: 16
    iterations: 64
