defaults:
  - jepa_dmc
  - _self_

model_family: temporal_straightening
logdir: logdir/temporal_straightening_dmc_vision/${scenario.name}/seed_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}

jepa_model:
  # Existing runs retain patch curvature; aggregation is an explicit paper-recipe arm.
  curvature_mode: patch
  aggregation:
    hidden_dim: 512
    output_dim: 128
  # Preserve the visual coefficient of the former mean over 208 visual + 10 proprio channels.
  prediction_weight: 0.9541284403669725
  encoder:
    embedding_dim: 208
    vision:
      base_channels: 13
  predictor:
    heads: 6
    mlp_dim: 816
  decoder:
    # Detached visualization only; excluded from the learning/control budget.
    enabled: false
    vision:
      base_channels: 34
  optim:
    weight_decay: 1e-2
    grad_clip: 1.0
  planner:
    type: gradient
    objective: ts_mpc  # Upstream mode=all, base=2, alpha=0; includes observed prefix.
    aggregate_goal_weight: 0.0  # Opt-in planning ablation using a previously trained agg head.
    samples: 16
    iterations: 32
    gradient_batch_size: 256  # Same candidates/objective; one pass for 16 envs x 16 candidates.
