task: ${scenario.task}
env_num: 16
# Checkpoint selection uses a small rollout set; final evaluation uses 50 episodes.
eval_episode_num: 5
action_repeat: 2
time_limit: 1000

seed: ${seed}
eval_seed: 1000000
device: ${device}

size: [64, 64]
dataset_root: ${oc.env:DMC_EXPERT_VISION_DATA_DIR,data/dmc_expert_vision}
proprio: null
goal_relation: false
model_io:
  observations:
    image:
      - ${env.size.0}
      - ${env.size.1}
      - 3
  action: ${scenario.action}
