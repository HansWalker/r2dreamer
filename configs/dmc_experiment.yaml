defaults:
  - scenario: cartpole_balance_sparse
  - env: dmc_vision
  - dmc_model
  - override hydra/job_logging: disabled
  - _self_

seed: 0
deterministic_run: False
device: "cuda:0"
model_family: dreamer
model_io: ${env.model_io}
resume_from: null
experiment_protocol: dmc_frozen_defaults_v15

expert_data:
  policy: tdmpc2
  policy_mode: mpc
  train_episodes: 10000
  heldout_episodes: 500

hydra:
  run:
    dir: ${logdir}

evaluation:
  # Report both first-hit and sustained success using the same threshold for every family.
  success_threshold: 0.8
  sustained_success_steps: 5
  final:
    checkpoint: final.pt
    episodes: 50
    seed: 3000000
    context_length: 64
    horizons: [1, 5, 10, 25]
    probe_train_windows: 128
    probe_test_windows: 128
    probe_batch_size: 8
    probe_ridge: 0.001
    probe_seed: 2000000

replay:
  # Length-64 families use batch 16; length-4 families override this to 256.
  # Both configurations expose each optimizer update to 1,024 observations.
  batch_size: 16
  sequence_length: 64
  # Retain the most recent half of the 40,000 online agent transitions.
  max_size: 20000
  storage_device: cpu
  # Draw from 16 source episodes once replay contains that many usable episodes.
  episodes_per_batch: 16
  device: ${device}
  seed: ${seed}

training:
  expert:
    enabled: false
    data_path: ${env.dataset_root}/${scenario.dataset}
    batch_size: ${replay.batch_size}
    updates: 5000
    shuffle: true
    log_every: 50
    eval_every: 0
    save_every: 500
  online:
    steps: 80000
    updates: 10000
    warmup_transitions: 1024
    log_every: 5000
    eval_every: 20000
    save_every: 20000
