defaults:
  - dmc_experiment
  - _self_

# Frozen representation-learning recipe. Family configs only override settings
# required by their original objectives and planners.
training:
  expert:
    enabled: true

env:
  goal: ${jepa_model.goal}

replay:
  batch_size: 336
  sequence_length: 4

jepa_model:
  use_amp: true  # BF16 neural compute; FP32 losses, physical readout, and action optimization.
  history_size: 3
  goal:
    source: physical_render_v1
    observation: ${scenario.goal_observation}
    # Physical tolerances are for diagnostics only, not the planning objective.
    geometry: ${scenario.goal.geometry}
    tolerance: ${scenario.goal.tolerance}
  encoder:
    embedding_dim: 192
    vision:
      patch_size: 8
      layers: 2
      heads: 3
      mlp_dim: 768
      dropout: 0.1
      base_channels: 12
  predictor:
    layers: 6
    heads: 3
    dim_head: 64
    mlp_dim: 512
    dropout: 0.1
    action_embedding_dim: 10
  projector_dim: 512
  sigreg:
    weight: 0.09
    knots: 17
    projections: 1024
  curvature_weight: 0.1
  decoder:
    weight: 1.0
    vision:
      base_channels: 12
  planner:
    type: cem
    horizon: ${scenario.planning_horizon}
    samples: 300
    elites: 30
    iterations: 6
    initial_std: 1.0
    min_std: 0.05
    max_std: 2.0
    lr: 1.0
    action_noise: 0.003
    gradient_batch_size: 32  # Maximum candidate trajectories per autograd pass; does not reduce restarts.
  optim:
    lr: 5e-5
    weight_decay: 1e-3
    grad_clip: 1.0
    encoder_lr: 1e-5
    predictor_lr: 5e-4
    action_encoder_lr: 5e-4
    decoder_lr: 3e-4
