defaults:
  - dmc_experiment
  - _self_

# Frozen representation-learning recipe. Family configs only override settings
# required by their original objectives and planners.
training:
  expert:
    enabled: true
    # Offline-only families select among four evenly spaced checkpoints.
    eval_every: 1250
  # The representation methods remain offline; reward is used only to select
  # among checkpoints through their task-relative planners.
  online:
    steps: 0

evaluation:
  final:
    checkpoint: pretrained_best.pt

replay:
  sequence_length: 4

jepa_model:
  history_size: 3
  goal:
    geometry: ${scenario.goal.geometry}
    tolerance: ${scenario.goal.tolerance}
    relation_weight: 1.0
    stable_steps: 2
    action_weight: 1e-4
    lr: 5e-4
    weight_decay: 1e-3
  encoder:
    embedding_dim: 192
    vision:
      patch_size: 8
      layers: 2
      heads: 3
      mlp_dim: 768
      dropout: 0.1
      base_channels: 12
  predictor:
    layers: 6
    heads: 3
    dim_head: 64
    mlp_dim: 512
    dropout: 0.1
    action_embedding_dim: 10
  projector_dim: 512
  sigreg:
    weight: 0.09
    knots: 17
    projections: 1024
  curvature_weight: 0.01
  decoder:
    weight: 1.0
    vision:
      base_channels: 12
  planner:
    type: cem
    horizon: ${scenario.planning_horizon}
    samples: 300
    elites: 30
    iterations: 6
    initial_std: 1.0
    min_std: 0.05
    max_std: 2.0
    lr: 1.0
    action_noise: 0.003
  optim:
    lr: 5e-5
    weight_decay: 1e-3
    grad_clip: 1.0
    encoder_lr: 1e-5
    predictor_lr: 5e-4
    action_encoder_lr: 5e-4
    decoder_lr: 3e-4
