defaults:
  - env: dmc_proprio
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/storm_dmc/transformer/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: "cuda:0"

hydra:
  run:
    dir: ${logdir}

batch_size: 32
batch_length: 64
eval_episode_num: 2

training:
  expert_epochs: 16
  online_steps: 80000

expert_data:
  data_path: ${oc.env:DMC_EXPERT_DATA_DIR,data/dmc_expert}/walker_walk

env:
  task: dmc_walker_walk
  env_num: 16
  eval_episode_num: ${eval_episode_num}
  action_repeat: 2
  time_limit: 1000

expert:
  enabled: true
  data_path: ${expert_data.data_path}
  batch_size: ${batch_size}
  seed: ${seed}
  shuffle: true
  min_epochs: 2
  log_every: 50
  save_every: 500

storm_model:
  sequence_core: transformer
  hidden_dim: 256
  num_layers: 2
  num_heads: 8
  max_length: 1024
  dropout: 0.1
  stoch_dim: 16
  encoder_hidden_dim: 256
  encoder_layers: 3
  decoder_hidden_dim: 256
  decoder_layers: 2
  head_hidden_dim: 256
  head_layers: 2
  act: ReLU
  kl_free: 1.0
  dyn_scale: 0.5
  rep_scale: 0.1
  use_amp: true
  amp_dtype: bfloat16
  lr: ${optim.world_model_lr}
  eps: ${optim.eps}
  grad_clip: ${optim.world_model_grad_clip}
  mamba:
    d_state: 32
    expand: 2
    headdim: 64
    chunk_size: 16
    is_mimo: false
    mimo_rank: 1
    is_outproj_norm: false

actor_critic:
  hidden_dim: 256
  layers: 2
  act: ReLU
  gamma: 0.985
  lambd: 0.95
  entropy_coef: 3e-4
  slow_critic_decay: 0.98
  use_amp: true
  amp_dtype: bfloat16
  lr: ${optim.actor_critic_lr}
  eps: ${optim.eps}
  grad_clip: ${optim.actor_critic_grad_clip}

optim:
  world_model_lr: 1e-4
  actor_critic_lr: 3e-5
  eps: 1e-5
  world_model_grad_clip: 1000.0
  actor_critic_grad_clip: 100.0

storm_train:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  context_length: 16
  imagine_context_length: 8
  imagine_horizon: 16
  imagine_batch_size: 512
  warmup_steps: 1024
  world_model_updates: 4
  actor_critic_updates: 4
  log_every: 5000
  eval_every: 10000
