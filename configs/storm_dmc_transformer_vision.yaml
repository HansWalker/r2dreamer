      ffn_dim: 1688
    mamba3:
      expand: 4
    hyena:
      ffn_dim: 1112

encoder:
  vision:
    stem_channels: 17

decoder:
  vision:
    stem_channels: 28

actor_critic:
  hidden_dim: 259

heads:
  hidden_dim: 224
