  - _self_

logdir: logdir/storm_dmc_vision/${scenario.name}/transformer/seed_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}

storm_model:
  hidden_dim: 384
  posterior:
    stoch_dim: 15
  recurrent:
