act_entropy: 3e-4
kl_free: 1.0
imag_horizon: 15
imag_batch_size: ${actor_critic.imagine_batch_size}
horizon: 333
lamb: 0.95
compile: False
device: ${device}

lr: 4e-5
agc: 0.3
pmin: 1e-3
eps: 1e-20
beta1: 0.9
beta2: 0.999
warmup: 1000
slow_target_update: 1
slow_target_fraction: 0.02

loss_scales:
  recon: 1.0
  rew: 1.0
  con: 1.0
  dyn: 1.0
  rep: 0.1
  policy: 1.0
  value: 1.0
  repval: 0.3
  bc: 1.0

rssm:
  core: block_gru
  deter: ${model.deter}
  posterior:
    stoch_dim: 32
    discrete_dim: ${model.discrete}
    hidden_dim: ${model.hidden}
    layers: 1
    act: ${model.act}
    unimix_ratio: 0.01
  prior:
    hidden_dim: ${model.hidden}
    layers: 2
    act: ${model.act}
  gru:
    hidden_dim: 443
    dyn_layers: 1
    blocks: 16
    act: ${model.act}
  device: ${device}
  mamba3:
    n_layers: 1
    d_state: 128
    expand: 1
    headdim: 64
    chunk_size: 16
    is_mimo: false
    mimo_rank: 1
    is_outproj_norm: false
  s5:
    state_dim: 128
    blocks: 1
    dt_min: 0.001
    dt_max: 0.1
    discretization: zoh
    ffn_dim: 444
    dropout: 0.0
  hyena:
    width: 352
    max_length: ${replay.sequence_length}
    order: 2
    ffn_dim: 280
    filter_order: 64
    filter_layers: 2
    embedding_dim: 3
    frequency: 1.0
    modulation_target: 0.01
    fast_decay: 0.3
    slow_decay: 1.5
    dropout: 0.0
  sliding_window:
    width: 352
    num_heads: 8
    ffn_dim: 474
    window_size: ${replay.sequence_length}
    dropout: 0.0
    act: ${model.act}

encoder:
  cnn:
    act: ${model.act}
    norm: ${model.norm}
    kernel_size: 5
    depth: ${model.depth}
    mults: [2, 3, 4, 4]

decoder:
  cnn_dist:
    name: 'mse'
  cnn:
    depth: ${model.depth}
    units: ${model.units}
    bspace: 8
    mults: [2, 3, 4, 4]
    act: ${model.act}
    norm: ${model.norm}
    kernel_size: 5

heads:
  hidden_dim: ${heads.hidden_dim}
  layers: ${heads.layers}
  reward_bins: ${heads.reward_bins}
  act: ${model.act}

actor:
  shape: null
  layers: ${actor_critic.layers}
  units: ${actor_critic.hidden_dim}
  act: ${model.act}
  norm: ${model.norm}
  device: ${device}
  dist:
    cont:
      name: 'bounded_normal'
      min_std: 0.1
      max_std: 1.0
  outscale: 0.01
  symlog_inputs: False
  name: 'actor'

critic:
  shape:
    - ${actor_critic.value_bins}
  layers: ${actor_critic.layers}
  units: ${actor_critic.hidden_dim}
  act: ${model.act}
  norm: ${model.norm}
  device: ${device}
  dist:
    name: 'symexp_twohot'
    bin_num: ${actor_critic.value_bins}
  outscale: 0.0
  symlog_inputs: False
  name: 'value'
