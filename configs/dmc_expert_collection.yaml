tdmpc2_root: ${oc.env:TDMPC2_DIR}
output_dir: ${oc.env:DMC_EXPERT_VISION_DATA_DIR,data/dmc_expert_vision}

# One collection per task. Training and evaluation read disjoint episode ranges
# from this dataset.
episodes:
  train: 10000
  heldout: 500
checkpoint_seed: 1
seed: 1

# Match TD-MPC2: each policy action spans two DMC control steps for 500 transitions.
action_repeat: 2
max_episode_steps: 500
time_limit: null

image_size: 64

expert:
  mpc: true
  iterations: 4
  num_samples: 256

progress_every: 25
resume: true

tasks:
  - cartpole/balance_sparse
  - reacher/easy
  - ball_in_cup/catch

# Optional task-to-path overrides. Published checkpoints are downloaded otherwise.
checkpoints: {}
