name: cartpole_balance_sparse
task: dmc_cartpole_balance_sparse
collection_task: cartpole/balance_sparse
dataset: cartpole_balance_sparse
planning_horizon: 5
goal_observation:
  cart_position: 0.0  # Metres from the track center.
  pole_angle: 0.0  # Radians from upright.
state_fields:
  position: [0, 1, 2]
  velocity: [0, 1]

goal_alternatives:
  - {cart_position: -0.1, pole_angle: 0.0}
  - {cart_position: 0.1, pole_angle: 0.0}

goal:
  # Native sparse reward bounds: centered cart and pole within acos(0.995) of upright.
  geometry: box
  tolerance: [0.25, 0.1000417136]

action:
  kind: continuous
  shape: [1]
