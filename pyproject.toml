[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dreamer"
version = "0.1.0"
description = "Capacity-matched world model comparisons on DeepMind Control Suite"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.8.0",
    "tensordict==0.9.1",
    "numpy==1.26.0",
    "hydra-core==1.3.2",
    "gymnasium==1.2.0",
    "tensorboard>=2.20,<3",
    "h5py>=3.10,<4",
    "cloudpickle>=3,<4",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dmc = ["dm_control==1.0.28", "mujoco==3.3.0"]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8"]

[tool.setuptools]
include-package-data = false
py-modules = ["buffer", "tools"]

[tool.setuptools.packages.find]
include = ["dmc_expert*", "envs*", "models*", "optim*", "scripts*", "training*"]
namespaces = false
